import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
}

def daymarkSigningStore = System.getenv("DAYMARK_SIGNING_STORE")
def daymarkSigningStorePassword = System.getenv("DAYMARK_SIGNING_STORE_PASSWORD")
def daymarkSigningKeyAlias = System.getenv("DAYMARK_SIGNING_KEY_ALIAS")
def daymarkSigningKeyPassword = System.getenv("DAYMARK_SIGNING_KEY_PASSWORD")
def daymarkGitCommit = System.getenv("DAYMARK_GIT_COMMIT")
def daymarkSigningResolved = System.getenv("DAYMARK_SIGNING_RESOLVED")
def daymarkWebClientPrebuilt = System.getenv("DAYMARK_WEB_CLIENT_PREBUILT")
def expectedDaymarkSigner = "890ddcf80b412cf3145b9ce0841e0d857226022bef20ae637ef0d0a8b5358676"
def daymarkWebClientDir = file("../../dist/client")
def generatedDaymarkWebAssetsDir = file("$buildDir/generated/daymarkWebAssets")
def daymarkWebProvenanceFile = new File(daymarkWebClientDir, ".daymark-web-provenance.json")
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
def gitCommand = isWindows && new File("C:/Program Files/Git/cmd/git.exe").isFile()
        ? "C:/Program Files/Git/cmd/git.exe"
        : "git"
def npmCommand = isWindows ? "npm.cmd" : "npm"
def hasDaymarkSigning = [
        daymarkSigningStore,
        daymarkSigningStorePassword,
        daymarkSigningKeyAlias,
        daymarkSigningKeyPassword
].every { it != null && !it.isEmpty() }
def isExactCommit = { value -> value != null && value ==~ /[0-9a-f]{40}/ }

def sha256Bytes = { byte[] bytes ->
    def digest = java.security.MessageDigest.getInstance("SHA-256").digest(bytes)
    digest.collect { String.format("%02x", it & 0xff) }.join()
}

def sha256File = { File input ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

def resolveDaymarkGitCommit = {
    def output = new ByteArrayOutputStream()
    def errors = new ByteArrayOutputStream()
    def result = project.exec {
        workingDir file("../..")
        commandLine gitCommand, "rev-parse", "HEAD"
        standardOutput = output
        errorOutput = errors
        ignoreExitValue = true
    }
    def commit = output.toString("UTF-8").trim()
    if (result.exitValue != 0 || !isExactCommit(commit)) {
        throw new GradleException(
                "Could not resolve an exact Git commit for the Daymark web client: " +
                        errors.toString("UTF-8").trim()
        )
    }
    return commit
}

def collectDaymarkWebFiles = {
    if (!daymarkWebClientDir.isDirectory()) {
        throw new GradleException("Daymark web client directory is missing: ${daymarkWebClientDir}")
    }
    def records = []
    daymarkWebClientDir.eachFileRecurse { candidate ->
        if (candidate.isFile() && candidate != daymarkWebProvenanceFile) {
            def relative = daymarkWebClientDir.toPath()
                    .relativize(candidate.toPath())
                    .toString()
                    .replace(File.separatorChar, '/' as char)
            records << [
                    path: relative,
                    sha256: sha256File(candidate),
                    bytes: candidate.length()
            ]
        }
    }
    records.sort { left, right -> left.path <=> right.path }
    return records
}

def writeDaymarkWebProvenance = {
    def commit = daymarkGitCommit ?: resolveDaymarkGitCommit()
    if (!isExactCommit(commit)) {
        throw new GradleException("Daymark web provenance requires an exact 40-character Git commit.")
    }
    def files = collectDaymarkWebFiles()
    def index = files.find { it.path == "index.html" }
    if (!index) {
        throw new GradleException("Daymark web client build did not emit index.html.")
    }
    def manifestText = files.collect {
        "${it.path}|${it.sha256}|${it.bytes}"
    }.join("\n")
    def metadata = [
            schemaVersion: 1,
            sourceCommit: commit,
            fileCount: files.size(),
            indexSha256: index.sha256,
            filesSha256: sha256Bytes(manifestText.getBytes("UTF-8")),
            files: files
    ]
    def temporary = new File(
            daymarkWebClientDir,
            ".daymark-web-provenance.${UUID.randomUUID().toString().replace('-', '')}.tmp"
    )
    temporary.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + "\n"
    if (!temporary.renameTo(daymarkWebProvenanceFile)) {
        daymarkWebProvenanceFile.text = temporary.text
        temporary.delete()
    }
}

def readDaymarkWebProvenance = {
    if (!daymarkWebProvenanceFile.isFile()) {
        throw new GradleException(
                "Android packaging requires exact Daymark web provenance metadata at " +
                        "${daymarkWebProvenanceFile}."
        )
    }
    def metadata
    try {
        metadata = new JsonSlurper().parse(daymarkWebProvenanceFile)
    }
    catch (Exception error) {
        throw new GradleException("Daymark web provenance metadata is not valid JSON: ${error.message}")
    }
    if (
            metadata.schemaVersion != 1 ||
            !isExactCommit(metadata.sourceCommit) ||
            !(metadata.fileCount instanceof Number) ||
            !(metadata.filesSha256 ==~ /[0-9a-f]{64}/) ||
            !(metadata.indexSha256 ==~ /[0-9a-f]{64}/)
    ) {
        throw new GradleException("Daymark web provenance metadata is incomplete.")
    }
    def expectedCommit = daymarkGitCommit ?: metadata.sourceCommit
    if (!isExactCommit(expectedCommit) || metadata.sourceCommit != expectedCommit) {
        throw new GradleException(
                "Daymark web assets are bound to ${metadata.sourceCommit}, not ${expectedCommit}."
        )
    }
    def files = collectDaymarkWebFiles()
    if (files.size() != metadata.fileCount as int) {
        throw new GradleException("Daymark web provenance file count does not match the built client.")
    }
    def actualManifest = files.collect {
        "${it.path}|${it.sha256}|${it.bytes}"
    }.join("\n")
    if (sha256Bytes(actualManifest.getBytes("UTF-8")) != metadata.filesSha256) {
        throw new GradleException("Daymark web asset hashes do not match their provenance metadata.")
    }
    return metadata
}

tasks.register("buildDaymarkWebClient", Exec) {
    group = "build"
    description = "Builds and records the exact Daymark web client before Android packaging."
    workingDir file("../..")
    commandLine npmCommand, "run", "build"
    doLast {
        writeDaymarkWebProvenance()
    }
}

tasks.register("packageDaymarkWebClient", Sync) {
    group = "build"
    description = "Packages the commit-bound Daymark client for offline WebView startup."
    if (daymarkWebClientPrebuilt != "1") {
        dependsOn(tasks.named("buildDaymarkWebClient"))
    }
    from(daymarkWebClientDir)
    into(new File(generatedDaymarkWebAssetsDir, "daymark"))
    includeEmptyDirs = false

    doFirst {
        if (!daymarkWebClientDir.isDirectory()
                || !new File(daymarkWebClientDir, "index.html").isFile()) {
            throw new GradleException(
                    "Android packaging requires a built Daymark client at " +
                            "${daymarkWebClientDir}/index.html."
            )
        }
        readDaymarkWebProvenance()
    }
}

def daymarkReleaseGate = tasks.register("verifyDaymarkReleaseInputs") {
    group = "verification"
    description = "Fails closed unless the actual Android release variant has protected signing and provenance."
    doLast {
        if (!hasDaymarkSigning) {
            throw new GradleException(
                    "A Daymark release requires DAYMARK_SIGNING_STORE, " +
                            "DAYMARK_SIGNING_STORE_PASSWORD, DAYMARK_SIGNING_KEY_ALIAS, and " +
                            "DAYMARK_SIGNING_KEY_PASSWORD. Debug signing is not valid for updates."
            )
        }
        if (daymarkSigningResolved != "daymark-signing-resolver-v1") {
            throw new GradleException("A Daymark release must use the protected signing resolver.")
        }
        if (!isExactCommit(daymarkGitCommit)) {
            throw new GradleException(
                    "A Daymark release requires DAYMARK_GIT_COMMIT with the exact 40-character Git commit."
            )
        }
        if (daymarkWebClientPrebuilt != "1") {
            throw new GradleException("A Daymark release requires DAYMARK_WEB_CLIENT_PREBUILT=1.")
        }
        readDaymarkWebProvenance()

        if (!new File(daymarkSigningStore).isFile()) {
            throw new GradleException("The Daymark signing store does not exist: ${daymarkSigningStore}")
        }
        char[] storePassword = daymarkSigningStorePassword.toCharArray()
        char[] keyPassword = daymarkSigningKeyPassword.toCharArray()
        try {
            def store = java.security.KeyStore.getInstance("PKCS12")
            new File(daymarkSigningStore).withInputStream { stream ->
                store.load(stream, storePassword)
            }
            def key = store.getKey(daymarkSigningKeyAlias, keyPassword)
            def certificate = store.getCertificate(daymarkSigningKeyAlias)
            if (!(key instanceof java.security.PrivateKey) || certificate == null) {
                throw new GradleException("The Daymark signing alias is not a PrivateKeyEntry.")
            }
            def digest = java.security.MessageDigest.getInstance("SHA-256")
                    .digest(certificate.getEncoded())
                    .collect { String.format("%02x", it & 0xff) }
                    .join()
            if (digest != expectedDaymarkSigner) {
                throw new GradleException("The Daymark release keystore does not contain the pinned original leaf signer.")
            }
        }
        finally {
            java.util.Arrays.fill(storePassword, (char) 0)
            java.util.Arrays.fill(keyPassword, (char) 0)
        }
    }
}

android {
    namespace "com.michaelunkai.daymark"
    compileSdk 34

    defaultConfig {
        applicationId "com.michaelunkai.daymark"
        minSdk 23
        targetSdk 34
        versionCode 34
        versionName "1.4.44"
        manifestPlaceholders = [daymarkGitCommit: daymarkGitCommit ?: "unverified"]
    }

    sourceSets {
        main {
            assets.srcDir(generatedDaymarkWebAssetsDir)
        }
    }

    if (hasDaymarkSigning) {
        signingConfigs {
            daymarkRelease {
                storeFile file(daymarkSigningStore)
                storePassword daymarkSigningStorePassword
                keyAlias daymarkSigningKeyAlias
                keyPassword daymarkSigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasDaymarkSigning) {
                signingConfig signingConfigs.daymarkRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def variantToken = variant.name.toLowerCase(java.util.Locale.ROOT)
        tasks.configureEach { task ->
            if (
                    task.path != daymarkReleaseGate.get().path &&
                    task.name.toLowerCase(java.util.Locale.ROOT).contains(variantToken)
            ) {
                task.dependsOn(daymarkReleaseGate)
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("packageDaymarkWebClient"))
}
