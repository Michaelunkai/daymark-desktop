plugins {
    id "com.android.application"
}

android {
    namespace "com.michaelunkai.daymark"
    compileSdk 34

    defaultConfig {
        applicationId "com.michaelunkai.daymark"
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "1.4.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
