<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="agent-manifest" href="/daymark-agent.json" />
    <title>Daymark workspace</title>
  </head>
  <body>
    <div id="root" data-daymark-ready="false">
      <main
        aria-live="polite"
        style="align-items:center;background:#000;color:#fff;display:flex;flex-direction:column;font-family:system-ui,sans-serif;gap:16px;justify-content:center;min-height:100vh;padding:24px;text-align:center"
      >
        <p style="font-size:18px;margin:0">Loading Daymark</p>
        <button
          onclick="window.location.reload()"
          style="background:#000;border:1px solid #fff;color:#fff;font:inherit;padding:10px 14px"
          type="button"
        >
          Reload Daymark
        </button>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
